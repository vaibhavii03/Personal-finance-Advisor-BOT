{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block public_content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="text-center mb-4">
        <a href="{{ url_for('landing') }}" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
          <div class="brand-icon-box">
            <i class="bi bi-wallet2"></i>
          </div>
          <span class="fs-4 fw-bold text-dark">{{ app_name }}</span>
        </a>
        <p class="text-muted small">Sign in to access your financial dashboard and AI recommendations.</p>
      </div>

      <div class="finance-card p-4 p-md-5">
        <h4 class="fw-bold mb-3">Welcome Back</h4>

        <form action="{{ url_for('auth.login') }}" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email if email else '' }}" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="remember" id="rememberCheck" checked>
              <label class="form-check-label small text-muted" for="rememberCheck">
                Remember me
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <span class="text-muted small">Don't have an account yet? </span>
          <a href="{{ url_for('auth.register') }}" class="fw-semibold text-success text-decoration-none">Create One Free</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
